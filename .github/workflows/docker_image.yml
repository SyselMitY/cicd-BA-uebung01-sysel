name: Docker Image (Artifact)

on:
  push:
    branches: [ main ]
    paths: [ 'Dockerfile', '.dockerignore', 'pom.xml', 'src/**', '.github/workflows/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'Dockerfile', '.dockerignore', 'pom.xml', 'src/**', '.github/workflows/**' ]

permissions:
  contents: read

jobs:
  docker-build-artifact:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (warm up Maven cache for build stage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Build single-platform image and load into the Docker engine (required for docker save)
      - name: Build (load to engine)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/cicdtest:${{ steps.vars.outputs.short_sha }}

      # Save the image to a tarball named with the commit SHA
      - name: Save image as artifact tar
        run: docker save -o image-${{ steps.vars.outputs.short_sha }}.tar local/cicdtest:${{ steps.vars.outputs.short_sha }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.vars.outputs.short_sha }}
          path: image-${{ steps.vars.outputs.short_sha }}.tar
          retention-days: 7

  scan-for-vulns-grype:
    runs-on: ubuntu-latest
    needs: docker-build-artifact
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.docker-build-artifact.outputs.short_sha }}

      - name: Load docker image
        run: docker load -i image-${{ needs.docker-build-artifact.outputs.short_sha }}.tar
      - name: Grype image scan
        uses: anchore/scan-action@v6
        id: scan
        with:
          image: "local/cicdtest:${{ needs.docker-build-artifact.outputs.short_sha }}"
          output-format: json

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report.json
          path: ${{ steps.scan.outputs.json }}


  scan-for-vulns-trivy:
    runs-on: ubuntu-latest
    needs: docker-build-artifact
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.docker-build-artifact.outputs.short_sha }}

      - name: Load docker image
        run: docker load -i image-${{ needs.docker-build-artifact.outputs.short_sha }}.tar

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: 'local/cicdtest:${{ needs.docker-build-artifact.outputs.short_sha }}'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-artifact.json
          path: trivy-image-report.json
